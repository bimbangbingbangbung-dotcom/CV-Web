<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal CV</title>
    <meta name="description" content="Personal curriculum vitae and portfolio website." />
    <meta name="theme-color" content="#fbfbfa" />

    <!--
      Pre-paint theme bootstrap. Runs BEFORE first paint so the correct
      light/dark theme is applied with no flash of wrong colors.
      Kept inline and tiny on purpose; the full theme logic lives in
      src/utils/theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cvweb:theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0e100f' : '#fbfbfa');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="preload"
      href="./fonts/geist-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <!-- All visible content is rendered from public/content.json by src/main.ts. -->
    </div>
    <noscript>
      <p style="padding: 2rem; text-align: center">
        This site needs JavaScript to display its content. You can
        <a href="./assets/cv.pdf">download the CV as a PDF</a> instead.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
